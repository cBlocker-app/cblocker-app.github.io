<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CBlocker</title>
<style>
:root{--bg:#F2F5F5;--ink:#13232B;--mut:#4A5B63;--ac:#0E6B6E}
@media(prefers-color-scheme:dark){:root{--bg:#101A1F;--ink:#E6EEF0;--mut:#9DB0B6;--ac:#5CC4C6}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,sans-serif}
main{max-width:480px;padding:24px}
h1{font:700 32px/1.15 Georgia,serif;margin:0 0 12px}
li{margin:6px 0}.m{color:var(--mut)}a{color:var(--ac)}
</style></head>
<body><main>
<h1>This page is blocked.</h1>
<p class="m">You set it up this way. Here is when it opens again:</p>
<ul id="list"></ul>
<p class="m" id="commit"></p>
<p><a href="#" id="opt">Open settings</a></p>
</main>
<script src="shared.js"></script>
<script src="blocked.js"></script>
</body></html>
